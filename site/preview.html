<style>
:root{
  --ground:#f3f6f8; --panel:#ffffff; --panel-2:#eef3f6;
  --ink:#16212b; --muted:#5f7180; --rule:#dde5ea;
  --red:#d4262b; --blue:#2f6fed; --ice:#0b1016;
  --shadow:0 1px 2px rgba(22,33,43,.06),0 8px 24px rgba(22,33,43,.06);
}
:root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){
  --ground:#0e1419; --panel:#161e26; --panel-2:#1c2731;
  --ink:#e8edf1; --muted:#8598a6; --rule:#26333d;
  --ice:#05080b; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --ground:#0e1419; --panel:#161e26; --panel-2:#1c2731;
  --ink:#e8edf1; --muted:#8598a6; --rule:#26333d;
  --ice:#05080b; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--ground);color:var(--ink);
  font:400 15px/1.55 "IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;}
h1,h2,h3{font-family:"Barlow Semi Condensed",var(--ink),sans-serif;font-weight:700;
  letter-spacing:.01em;margin:0;text-wrap:balance;}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 56px;}

/* ---- broadcast bug ---- */
header{border-bottom:1px solid var(--rule);background:var(--panel);}
.bug{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;
  gap:18px;flex-wrap:wrap;}
.bug .title{font-family:"Barlow Semi Condensed",sans-serif;font-weight:600;font-size:13px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
.score{display:flex;align-items:baseline;gap:10px;font-family:"Barlow Semi Condensed",sans-serif;}
.score .club{font-weight:600;font-size:19px;}
.score .n{font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;}
.score .sep{color:var(--muted);font-size:22px;}
.score .periods{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;
  border-left:1px solid var(--rule);padding-left:10px;margin-left:2px;}
.bug select{margin-left:auto;}
select{font:500 14px "IBM Plex Sans",sans-serif;color:var(--ink);background:var(--panel-2);
  border:1px solid var(--rule);border-radius:7px;padding:6px 9px;}

.slice{max-width:1180px;margin:0 auto;padding:9px 20px;font-size:13px;color:var(--muted);
  border-bottom:1px solid var(--rule);background:var(--panel);}
.slice b{color:var(--ink);font-weight:600;}

/* ---- filter rail ---- */
.rail{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-end;padding:18px 0 22px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field > span{font-family:"Barlow Semi Condensed",sans-serif;font-weight:600;font-size:12px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--panel);}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);
  font:500 13px "IBM Plex Sans",sans-serif;padding:7px 13px;cursor:pointer;
  border-right:1px solid var(--rule);}
.seg button:last-child{border-right:0;}
.seg button[aria-pressed="true"]{background:var(--red);color:#fff;}
.seg button:focus-visible{outline:2px solid var(--blue);outline-offset:-2px;}

/* ---- working area ---- */
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start;}
@media (max-width:900px){.grid{grid-template-columns:1fr;}}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:16px;box-shadow:var(--shadow);}
.card h2{font-size:16px;display:flex;align-items:baseline;gap:10px;}
.card h2 small{font-weight:400;font-family:"IBM Plex Sans",sans-serif;color:var(--muted);font-size:12px;}
canvas{width:100%;height:auto;display:block;border-radius:8px;background:var(--ice);margin-top:10px;}
.legend{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--muted);}
.ramp{height:8px;flex:1;border-radius:4px;
  background:linear-gradient(90deg,#000004,#420a68,#932667,#dd513a,#fca50a,#fcffa4);}

.units{margin-top:14px;display:flex;flex-direction:column;gap:9px;}
.unit-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.unit-row .team{font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:12px;
  letter-spacing:.08em;color:var(--muted);width:44px;}
.chip{font:500 12px/1 "IBM Plex Sans",sans-serif;font-variant-numeric:tabular-nums;
  border:1px solid var(--rule);border-radius:999px;padding:5px 9px;display:inline-flex;gap:6px;align-items:center;}
.chip b{font-weight:600;}
.tag{font-size:10px;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:2px 5px;}
.tag.full{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue);}
.tag.partial{background:color-mix(in srgb,var(--muted) 22%,transparent);color:var(--muted);}
.tag.juggle{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red);}

table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--rule);vertical-align:top;font-size:13.5px;}
th{font-family:"Barlow Semi Condensed",sans-serif;font-weight:600;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);}
tbody tr.goal td{background:color-mix(in srgb,var(--red) 9%,transparent);}
td .st{font-size:11px;color:var(--muted);letter-spacing:.04em;}
.count{color:var(--muted);font-weight:400;font-size:12px;font-family:"IBM Plex Sans",sans-serif;}
.empty{color:var(--muted);padding:14px 8px;}

footer{max-width:1180px;margin:18px auto 0;padding:14px 20px 0;border-top:1px solid var(--rule);
  color:var(--muted);font-size:12px;line-height:1.7;}
footer code{background:var(--panel-2);border:1px solid var(--rule);border-radius:4px;padding:1px 5px;font-size:11px;}
@media (prefers-reduced-motion:no-preference){.seg button,select{transition:background .12s,color .12s;}}
</style>
</head>

<script>
"use strict";
const B = JSON.parse(document.getElementById("bundle").textContent);
const $ = s => document.querySelector(s);

/* ---- csv ---- */
function csv(t){const [h,...r]=t.trim().split(/\r?\n/);const c=h.split(",");
  return r.map(x=>{const v=sc(x);return Object.fromEntries(c.map((k,i)=>[k,v[i]??""]));});}
function sc(l){const o=[];let s="",q=false;for(const ch of l){
  if(q){if(ch==='"')q=false;else s+=ch;}else if(ch===','){o.push(s);s="";}
  else if(ch==='"')q=true;else s+=ch;}o.push(s);return o;}
const assists = c => (String(c).match(/'([^']*)'|"([^"]*)"/g)||[]).map(s=>s.slice(1,-1));

const G = B.game;
const EVENTS = csv(B.events);
const POINTS = csv(B.points);
const IDENT  = csv(B.identity);
const sel = { period:"all", team:"", player:"", types:new Set(G.filters.eventTypes) };

/* ---- header ---- */
(function(){
  const opt=document.createElement("option");
  opt.value=B.games.games[0].dir; opt.textContent=B.games.games[0].label;
  $("#game").append(opt); $("#game").value=opt.value; $("#game").disabled=true;
  $("#score").innerHTML =
    `<span class="club">${G.away}</span><span class="n">${G.score.split(":")[1]}</span>`+
    `<span class="sep">:</span><span class="n">${G.score.split(":")[0]}</span>`+
    `<span class="club">${G.home}</span>`+
    `<span class="periods">${G.periods.map(p=>p.dur_min+"′").join("  ")}</span>`;
  const win = B.grids.all.meta ? B.grids.all.meta.window_s : [2600,2820];
  $("#slice").innerHTML = `Preview covers a <b>${win[1]-win[0]} s slice of Period 2</b> `+
    `(video ${win[0]}–${win[1]} s) — the window the tracking / homography / identity pass has run on. `+
    `Events table is the full game.`;
  $("#prov").innerHTML =
    `homography <code>rink_kp_v2.pt</code> · track de-frag 942→174 IDs · `+
    `jersey identity ${IDENT.filter(r=>r.name).length}/40 players · `+
    `heatmap unit ${B.grids.all.unit} occupied per ${B.grids.all.cell} m cell · `+
    `data: <code>heatmaps/*.grid.json</code> + <code>*_points.csv</code>, `+
    `<code>identity/number_votes.csv</code>, <code>lines/units.json</code>`;
})();

/* ---- controls ---- */
function seg(host, items, cur, on){
  host.innerHTML="";
  items.forEach(([val,label])=>{
    const b=document.createElement("button");
    b.textContent=label; b.setAttribute("aria-pressed", String(val===cur));
    b.onclick=()=>{ on(val); [...host.children].forEach(c=>c.setAttribute("aria-pressed","false"));
      b.setAttribute("aria-pressed","true"); render(); };
    host.append(b);
  });
}
seg($("#period"), [["all","All"],...G.periods.map(p=>[String(p.period),"P"+p.period])],
    "all", v=>sel.period=v);
seg($("#team"), [["","Both"],...G.filters.teams.map(t=>[t,t])], "", v=>{sel.team=v;});
(function(){
  const p=$("#player"); p.innerHTML=`<option value="">All players</option>`;
  const bt={}; G.players.forEach(x=>(bt[x.team]||=[]).push(x));
  const named=new Set(IDENT.filter(r=>r.name).map(r=>r.name));
  Object.entries(bt).forEach(([tm,list])=>{
    const og=document.createElement("optgroup"); og.label=tm;
    list.sort((a,b)=>(+a.number||99)-(+b.number||99)).forEach(x=>{
      const tracked = named.has(x.name);
      og.append(new Option(`#${x.number} ${x.name}${tracked?" ◆":""}`, x.name));
    });
    p.append(og);
  });
  p.onchange=()=>{ sel.player=p.value; render(); };
})();
seg($("#types"), G.filters.eventTypes.map(t=>[t,t[0].toUpperCase()+t.slice(1)]),
    "__multi__", ()=>{});
[...$("#types").children].forEach(b=>{
  b.setAttribute("aria-pressed","true");
  b.onclick=()=>{ const v=b.textContent.toLowerCase();
    sel.types.has(v)?sel.types.delete(v):sel.types.add(v);
    b.setAttribute("aria-pressed", String(sel.types.has(v))); render(); };
});

/* ---- filters ---- */
function evVisible(r){
  if(sel.period!=="all" && r.period!==sel.period) return false;
  if(sel.team && r.team!==sel.team) return false;
  if(sel.player && !(r.player===sel.player||r.scorer===sel.player||assists(r.assists).includes(sel.player))) return false;
  if(!sel.types.has(r.type)) return false;
  return true;
}

/* ---- render ---- */
function render(){ renderEvents(); renderUnits(); renderHeatmap(); }

function renderEvents(){
  const rows=EVENTS.filter(evVisible);
  $("#evcount").textContent=`${rows.length} of ${EVENTS.length}`;
  $("#events tbody").innerHTML = rows.map(r=>{
    const d = r.type==="goal"
      ? `<b>${r.score}</b> ${r.scorer}${assists(r.assists).length?` <span class="st">(${assists(r.assists).join(", ")})</span>`:""}`
      : `${r.player} — ${r.infraction} <span class="st">${r.minutes}′</span>`;
    return `<tr class="${r.type}"><td>${r.period}</td><td>${r.game_clock}</td><td>${r.team}</td>`+
           `<td>${d}</td><td class="st">${r.state||"—"}</td></tr>`;
  }).join("") || `<tr><td colspan="5" class="empty">No events match this filter.</td></tr>`;
}

function renderUnits(){
  const j=B.units, rows=[];
  for(const [tm,r] of Object.entries(j)){
    if(sel.team && tm!==sel.team) continue;
    const chips=r.forward_units.map(u=>{
      const cls=u.match||"partial";
      return `<span class="chip"><b>${u.members.join("·")}</b>`+
        (u.paper_unit?`<span class="tag ${cls}">${u.paper_unit} ${cls}</span>`:"")+`</span>`;
    }).join("");
    rows.push(`<div class="unit-row"><span class="team">${tm}</span>${chips}</div>`);
  }
  $("#units").innerHTML = `<div class="st" style="color:var(--muted);font-size:12px">Recovered forward lines — co-occurrence of identified numbers, matched to the lineup sheet</div>`+rows.join("");
}

/* ---- heatmap ---- */
function inferno(v){v=Math.max(0,Math.min(1,v));
  const s=[[0,0,4],[40,11,84],[101,21,110],[159,42,99],[212,72,66],[245,125,21],[250,193,39],[252,255,164]];
  const f=v*(s.length-1),i=Math.floor(f),t=f-i,a=s[i],b=s[Math.min(i+1,s.length-1)];
  return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}

function binPoints(){
  const nx=120,ny=60,cell=0.5,d=new Float32Array(nx*ny);let n=0;
  for(const r of POINTS){
    if(sel.period!=="all" && String(r.period)!==sel.period) continue;
    if(sel.team && r.team!==sel.team) continue;
    if(sel.player && r.name!==sel.player) continue;
    const rx=+r.rx,ry=+r.ry;
    if(!(rx>=0&&rx<60&&ry>=0&&ry<30)) continue;
    d[((ry/30*ny)|0)*nx+((rx/60*nx)|0)]+=cell; n++;
  }
  // light box blur
  const t=d.slice(),r=2;
  for(let y=0;y<ny;y++)for(let x=0;x<nx;x++){let s=0,c=0;
    for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const yy=y+dy,xx=x+dx;
      if(yy<0||yy>=ny||xx<0||xx>=nx)continue;s+=t[yy*nx+xx];c++;}
    d[y*nx+x]=s/c;}
  let mx=0;for(const v of d)mx=Math.max(mx,v);
  return {nx,ny,data:d,max:mx||1,n};
}

function renderHeatmap(){
  let Gd,note;
  const usePts = !!sel.player;
  if(usePts){
    Gd=binPoints();
    note=`${sel.player} · ${Gd.n} samples · binned live from points.csv`;
  }else{
    const key = sel.team ? sel.team.toLowerCase() : "all";
    const g = B.grids[key];
    // period filter with a pre-baked grid: fall back to points binning
    if(sel.period!=="all"){
      Gd=binPoints(); note=`P${sel.period}${sel.team?" · "+sel.team:""} · ${Gd.n} samples · points.csv`;
    }else{
      Gd={nx:g.nx,ny:g.ny,data:g.grid,max:g.max,n:g.n};
      note=`p2_2600_2820_${key}.grid.json · ${g.n} samples`;
    }
  }
  $("#hmnote").textContent = "— " + note;
  $("#hmunit").textContent = `peak ≈ ${Gd.max.toFixed(1)} s / cell`;
  paint(Gd);
}

function paint(Gd){
  const cv=$("#rink"),ctx=cv.getContext("2d"),W=cv.width,H=cv.height;
  const img=ctx.createImageData(W,H);
  for(let py=0;py<H;py++)for(let px=0;px<W;px++){
    const gx=Math.min(Gd.nx-1,(px/W*Gd.nx)|0), gy=Math.min(Gd.ny-1,((1-py/H)*Gd.ny)|0);
    const v=Gd.data[gy*Gd.nx+gx]/Gd.max,[r,g,b]=inferno(v),o=(py*W+px)*4;
    img.data[o]=r;img.data[o+1]=g;img.data[o+2]=b;img.data[o+3]=Math.min(240,28+v*228);
  }
  ctx.putImageData(img,0,0);
  strokeRink(ctx,W,H);
}
function strokeRink(ctx,W,H){
  const X=m=>m/60*W, Y=m=>H-m/30*H;
  ctx.lineWidth=1.2;
  ctx.strokeStyle="rgba(255,255,255,.42)";
  ctx.strokeRect(1.5,1.5,W-3,H-3);
  ctx.strokeStyle="rgba(120,170,255,.85)";
  [22.5,37.5].forEach(x=>{ctx.beginPath();ctx.moveTo(X(x),0);ctx.lineTo(X(x),H);ctx.stroke();});
  ctx.strokeStyle="rgba(255,86,86,.85)";
  [4,30,56].forEach(x=>{ctx.beginPath();ctx.moveTo(X(x),0);ctx.lineTo(X(x),H);ctx.stroke();});
  ctx.strokeStyle="rgba(255,255,255,.32)";
  ctx.beginPath();ctx.arc(X(30),Y(15),4.5/30*H,0,7);ctx.stroke();
  [[10,7],[10,23],[50,7],[50,23]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(X(x),Y(y),4.5/30*H,0,7);ctx.stroke();});
  ctx.fillStyle="rgba(255,86,86,.9)";
  [[30,15],[10,7],[10,23],[50,7],[50,23]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(X(x),Y(y),2.5,0,7);ctx.fill();});
}

render();
</script>
